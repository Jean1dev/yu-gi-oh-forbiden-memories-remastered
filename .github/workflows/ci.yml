name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a main deployment. Feature branch runs can be superseded
  # by a newer commit because only their latest result matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and validate dependency boundaries
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build production application
        run: pnpm build

  validate-database:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild database from migrations
        run: pnpm exec supabase db reset

      - name: Lint database
        run: pnpm exec supabase db lint --local --fail-on error

      - name: Export local Supabase credentials
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run Supabase integration tests
        run: pnpm --filter @yugioh/web test:integration

  deploy-database:
    name: Deploy Supabase migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - validate-database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link production project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: pnpm exec supabase db push --dry-run

      - name: Apply pending migrations
        run: pnpm exec supabase db push
